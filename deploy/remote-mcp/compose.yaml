# DIAPORIA remote research/read-only MCP stack: Caddy (TLS, path allowlist) -> app (read-only profile).
# Run from the repository root:
#   docker compose -f deploy/remote-mcp/compose.yaml --env-file deploy/remote-mcp/.env up -d --build
# Secrets (owner keys) come from deploy/remote-mcp/secrets/app.env (mode 0600, never committed).
name: diaporia-remote-mcp

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/remote-mcp/Dockerfile
    image: diaporia-remote-mcp:${DIAPORIA_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${DIAPORIA_SECRETS_FILE:-./secrets/app.env}
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      PUBLIC_BASE_URL: https://${MCP_HOSTNAME:?set MCP_HOSTNAME}${PUBLIC_PORT_SUFFIX:-}
      DIAPORIA_DB_PATH: /data/remote.sqlite
      DIAPORIA_TRUSTED_PROXIES: 172.31.250.10
      DIAPORIA_WEB_RATE_PER_MIN: ${DIAPORIA_WEB_RATE_PER_MIN:-30}
      DIAPORIA_MCP_RATE_PER_MIN: ${DIAPORIA_MCP_RATE_PER_MIN:-120}
      DIAPORIA_MAX_OAUTH_CLIENTS: ${DIAPORIA_MAX_OAUTH_CLIENTS:-200}
      DIAPORIA_REGISTER_PER_HOUR: ${DIAPORIA_REGISTER_PER_HOUR:-10}
      DIAPORIA_GRANT_MAX_AGE_SEC: ${DIAPORIA_GRANT_MAX_AGE_SEC:-86400}
      DIAPORIA_REVOKE_ALL_GRANTS_ON_START: ${DIAPORIA_REVOKE_ALL_GRANTS_ON_START:-0}
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks:
      edge:
        ipv4_address: 172.31.250.20

  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      MCP_HOSTNAME: ${MCP_HOSTNAME:?set MCP_HOSTNAME}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@invalid}
    ports:
      - "${PUBLISH_HTTP:-80}:80"
      - "${PUBLISH_HTTPS:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ${ORIGIN_CERT_DIR:-./certs}:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks:
      edge:
        ipv4_address: 172.31.250.10

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24
